name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # The official gitleaks Docker image is used directly (pinned version).
      - name: Scan the whole git history
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.21.2 git /repo --log-opts="--all" --no-banner -v

      - name: Scan the working tree
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2 dir /repo --no-banner -v

  tests:
    name: Tests (unit + integration)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Prepare demo environment
        run: cp .env.example .env

      # Same command as in the README: builds the images, starts postgres,
      # applies the migration, loads the synthetic demo data and runs pytest.
      - name: Run tests
        run: docker compose --profile test run --rm tests

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
